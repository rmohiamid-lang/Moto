name: Déployer sur GitHub Pages

on:
  push:
    branches: [main, claude/anki-flashcard-app-vct853]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Versionner le cache hors ligne
        run: |
          sed -i "s/const CACHE = 'moto-dev';/const CACHE = 'moto-${GITHUB_SHA::7}';/" sw.js
          grep -q "moto-${GITHUB_SHA::7}" sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
